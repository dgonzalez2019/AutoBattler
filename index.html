<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1e" />
    <!-- Installable: "Add to Home Screen" opens the game fullscreen, without browser bars -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AutoBattler" />
    <title>AutoBattler</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1e; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100dvh; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0f1e; color: #e8ecff;
        font: 700 22px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your phone to landscape to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
